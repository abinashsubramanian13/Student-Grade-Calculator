<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Grade Calculator</h1>

        <label for="name">Student Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="roll">Roll Number</label>
        <input type="text" id="roll" placeholder="Enter your roll number">

        <label for="mark1">Tamil</label>
        <input type="number" id="mark1" placeholder="Enter mark">

        <label for="mark2">English</label>
        <input type="number" id="mark2" placeholder="Enter mark">
       
        <label for="mark3">Chemistry</label>
        <input type="number" id="mark3" placeholder="Enter mark">

        <label for="mark4">Mathematics</label>
        <input type="number" id="mark4" placeholder="Enter mark">

        <label for="mark5">Physics</label>
        <input type="number" id="mark5" placeholder="Enter mark">

        <label for="mark6">Computer Science</label>
        <input type="number" id="mark6" placeholder="Enter mark">


        <button onclick="calculateGrade()">Calculate Grade</button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
